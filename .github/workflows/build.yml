name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows RelWithDebInfo
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      BUILD_TYPE: RelWithDebInfo
      SKIA_BUILD: Release
      SKIA_CPU: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        uses: aseprite/get-ninja@main

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download Skia
        shell: pwsh
        run: |
          $skiaTag = (Get-Content -Raw laf/misc/skia-tag.txt).Trim()
          $skiaVersion = $skiaTag.Split('-')[0]
          $skiaUrl = "https://github.com/aseprite/skia/releases/download/$skiaTag/Skia-Windows-$env:SKIA_BUILD-$env:SKIA_CPU.zip"
          $skiaZip = Join-Path $env:RUNNER_TEMP 'skia.zip'
          $skiaDir = Join-Path $env:GITHUB_WORKSPACE ".deps\skia-$skiaVersion"

          New-Item -ItemType Directory -Force -Path $skiaDir | Out-Null
          curl.exe --ssl-revoke-best-effort -L -o $skiaZip $skiaUrl
          7z x $skiaZip "-o$skiaDir" -y

          $skiaLibraryDir = Join-Path $skiaDir "out\$env:SKIA_BUILD-$env:SKIA_CPU"

          "SKIA_DIR=$skiaDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SKIA_LIBRARY_DIR=$skiaLibraryDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SKIA_LIBRARY=$skiaLibraryDir\skia.lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
            -DENABLE_CCACHE=off `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR="$env:SKIA_DIR" `
            -DSKIA_LIBRARY_DIR="$env:SKIA_LIBRARY_DIR" `
            -DSKIA_LIBRARY="$env:SKIA_LIBRARY"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --target aseprite

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-windows-${{ env.BUILD_TYPE }}
          if-no-files-found: error
          path: |
            build/bin/data
            build/bin/aseprite.exe
            build/bin/icudtl.dat
